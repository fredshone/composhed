[project]
name = "composhed"
version = "0.1.0"
description = "Composhed: compositional activity schedule baseline model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "polars",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "joblib",
    "biogeme",
    "acteval>=0.1.1",
    "torch>=2.11.0",
    "click>=8.3.3",
]

[project.scripts]
composhed-train = "composhed.train:main"
composhed-generate = "composhed.generate:main"
composhed-train-mdcev = "composhed.train_mdcev:main"
composhed-generate-mdcev = "composhed.generate_mdcev:main"
composhed-evaluate = "composhed.evaluate:main"

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["composhed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
